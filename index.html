
<!DOCTYPE html>
<html>
<head>
    <title>My Docker App</title>

    <style>
        body {
            background: linear-gradient(135deg, #00c6ff, #7b2ff7);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            padding: 40px;
            margin: auto;
            width: 500px;
            border-radius: 15px;
        }

        h1 {
            color: #7b2ff7;
        }

        p {
            color: #333;
            font-size: 18px;
        }

        button {
            background: #ff4b2b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🐳 Hello from Docker!</h1>
        <p>This application is running inside a Docker container.</p>
        <button>Docker App</button>
    </div>

</body>
</html>
